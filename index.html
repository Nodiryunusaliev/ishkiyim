let lang='uz';

function setLang(l){
  lang=l;
  document.documentElement.lang=l;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.textContent.toLowerCase()===l));
  document.querySelectorAll('[data-t]').forEach(el=>{
    const key=el.getAttribute('data-t');
    if(T[l][key]!==undefined) el.innerHTML=T[l][key];
  });
  document.querySelectorAll('[data-ph]').forEach(el=>{
    const key=el.getAttribute('data-ph');
    if(T[l][key]!==undefined) el.placeholder=T[l][key];
  });
}

async function submitForm(){
  const name=document.getElementById('f-name').value.trim();
  const email=document.getElementById('f-email').value.trim();
  const product=document.getElementById('f-product').value;
  const qty=document.getElementById('f-qty').value;
  const company=document.getElementById('f-company').value.trim();
  const phone=document.getElementById('f-phone').value.trim();
  const msg=document.getElementById('f-msg').value.trim();
  if(!name||!email||!product||!qty){alert(T[lang].f_alert);return;}
  const btn=document.getElementById('submit-btn');
  btn.textContent=T[lang].f_sending;btn.disabled=true;
  const data={
    access_key:'1b58f2fa-67d2-4da9-9539-63b388ff8df8',
    subject:`Quote Request from ${name} – ${product}`,
    from_name:name,email:email,
    message:`Name: ${name}\nCompany: ${company}\nEmail: ${email}\nPhone: ${phone}\n\nProduct: ${product}\nQuantity: ${qty}\n\nMessage:\n${msg}`
  };
  try{
    const res=await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    const json=await res.json();
    if(json.success){btn.style.display='none';document.getElementById('success-msg').style.display='block';}
    else{btn.textContent=T[lang].f_submit;btn.disabled=false;alert('Error. Please try again.');}
  }catch(e){btn.textContent=T[lang].f_submit;btn.disabled=false;alert('Network error.');}
}

setLang('uz');
</script>
